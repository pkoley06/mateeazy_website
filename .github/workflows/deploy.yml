name: Check & Deploy Website

on:
  # main -> https://mateeazy.in
  # Pull requests into main only run the checks.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; a newer push waits instead of cutting an upload short.
  group: website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript has no syntax errors
        run: node --check main.js

      - name: Every file the pages link to exists
        run: |
          # Local paths in src, href, data-video and data-poster ("/assets/…").
          missing=0
          for path in $(grep -ohE '(src|href|data-video|data-poster)="/[^"#?]*' index.html 404.html \
                          | sed -E 's/^[a-z-]+="\///' | sort -u); do
            [ -z "${path}" ] && continue
            if [ ! -e "${path}" ]; then
              echo "::error::Missing file: /${path}"
              missing=1
            fi
          done
          exit ${missing}

  deploy:
    name: Deploy to mateeazy.in
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mateeazy.in
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect the files to publish
        run: |
          # Everything except repo tooling and docs.
          rsync -a --exclude .git --exclude .github --exclude deploy \
                --exclude README.md --exclude .gitignore ./ dist/
          du -sh dist

      - name: Configure SSH credentials
        env:
          SSH_KEY: ${{ secrets.SITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          # The key's forced command on the VM (/usr/local/bin/mateeazy-site-deploy)
          # unpacks this archive into /var/www/mateeazy-site.
          tar -czf - -C dist . \
            | ssh -o IdentitiesOnly=yes -o BatchMode=yes -i ~/.ssh/id_ed25519 \
                "deploy@${OCI_HOST}" "deploy ${GITHUB_SHA}"

      - name: Verify the live site
        run: |
          live="$(curl -fsS "https://mateeazy.in/version.txt?ci=${GITHUB_RUN_ID}")"
          if [ "${live}" != "${GITHUB_SHA}" ]; then
            echo "::error::mateeazy.in serves ${live}, expected ${GITHUB_SHA}"
            exit 1
          fi
          curl -fsS https://mateeazy.in/ | grep -q "<title>MateEazy"
          curl -fsSI https://mateeazy.in/assets/video/discover.mp4 | grep -qi "content-type: video/mp4"
          echo "https://mateeazy.in is serving ${GITHUB_SHA}."
