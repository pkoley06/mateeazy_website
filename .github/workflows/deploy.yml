name: Check & Deploy Website

on:
  # main -> https://mateeazy.in (production API)
  # dev  -> staging build (https://staging-api.mateeazy.in)
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check & Build (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck and build
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'dev' && 'https://staging-api.mateeazy.in' || 'https://api.mateeazy.in' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: App Links file is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('dist/.well-known/assetlinks.json','utf8'))"

      - name: Upload staging build artifact
        if: github.ref_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: mateeazy-website-staging
          path: dist/

  deploy-prod:
    name: Deploy to mateeazy.in
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mateeazy.in
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production website
        env:
          VITE_API_BASE_URL: https://api.mateeazy.in
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build
          du -sh dist

      - name: Configure SSH credentials
        env:
          SSH_KEY: ${{ secrets.SITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          tar -czf - -C dist . \
            | ssh -o IdentitiesOnly=yes -o BatchMode=yes -i ~/.ssh/id_ed25519 \
                "deploy@${OCI_HOST}" "deploy ${GITHUB_SHA}"

      - name: Verify the live site
        run: |
          live="$(curl -fsS "https://mateeazy.in/version.txt?ci=${GITHUB_RUN_ID}")"
          if [ "${live}" != "${GITHUB_SHA}" ]; then
            echo "::error::mateeazy.in serves ${live}, expected ${GITHUB_SHA}"
            exit 1
          fi

  deploy-staging:
    name: Deploy to staging.mateeazy.in
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.mateeazy.in
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build staging website
        env:
          VITE_API_BASE_URL: https://staging-api.mateeazy.in
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          npm ci
          npm run build
          du -sh dist

      - name: Deploy to staging VM (if STAGING_SITE_DEPLOY_SSH_KEY is configured)
        env:
          SSH_KEY: ${{ secrets.STAGING_SITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          OCI_HOST: ${{ secrets.OCI_HOST }}
        run: |
          if [ -z "${SSH_KEY}" ]; then
            echo "STAGING_SITE_DEPLOY_SSH_KEY secret is not set yet; skipping SSH upload."
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          tar -czf - -C dist . \
            | ssh -o IdentitiesOnly=yes -o BatchMode=yes -i ~/.ssh/id_ed25519 \
                "deploy@${OCI_HOST}" "deploy ${GITHUB_SHA}"
